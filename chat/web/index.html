<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZooClaw chat</title>

<style>
  :root {
    color-scheme: light dark;
    --bg: #fff; --fg: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --mine: #eef2ff; --field: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #e8eaed; --muted: #9aa1ac;
            --line: #262a33; --mine: #1c2333; --field: #171a21; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center;
  }
  header b { color: var(--fg); font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; max-width: 82%;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .user .bubble { background: var(--mine); }
  .assistant .bubble { border: 1px solid var(--line); }
  .status { color: var(--muted); font-size: 13px; font-style: italic; }
  .error { color: #dc2626; font-size: 13px; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  form {
    border-top: 1px solid var(--line); padding: 14px 20px;
    display: flex; gap: 10px; max-width: 760px; margin: 0 auto; width: 100%;
  }
  textarea {
    flex: 1; resize: none; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--field); color: inherit;
    font: inherit; max-height: 160px;
  }
  button {
    padding: 0 18px; border-radius: 10px; border: 0;
    background: var(--fg); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
</style>

<header>
  <b>ZooClaw chat</b>
  <span>· your agent, over the API</span>
  <span style="margin-left:auto"><a href="#" id="reset" style="color:inherit">new conversation</a></span>
</header>

<div id="log"><div class="wrap" id="wrap">
  <div class="empty">Say something to your agent.</div>
</div></div>

<form id="form">
  <textarea id="input" rows="1" placeholder="Message your agent…" autofocus></textarea>
  <button id="send">Send</button>
</form>

<script type="module">
  const wrap = document.getElementById('wrap')
  const form = document.getElementById('form')
  const input = document.getElementById('input')
  const send = document.getElementById('send')

  // The session id is the only thing the browser stores. The transcript itself lives in
  // ZooClaw and is fetched back on reload — there is no database in this template.
  const KEY = 'zoowork-chat-session'
  let session = localStorage.getItem(KEY)

  const bubble = (role, text) => {
    wrap.querySelector('.empty')?.remove()
    const row = document.createElement('div')
    row.className = `msg ${role}`
    const b = document.createElement('div')
    b.className = 'bubble'
    b.textContent = text
    row.append(b)
    wrap.append(row)
    scroll()
    return b
  }
  const note = (cls, text) => {
    const el = document.createElement('div')
    el.className = cls
    el.textContent = text
    wrap.append(el)
    scroll()
    return el
  }
  const scroll = () => document.getElementById('log').scrollTo({ top: 1e9, behavior: 'smooth' })

  if (session) {
    try {
      const r = await fetch(`/api/history?session=${encodeURIComponent(session)}`)
      const { messages = [] } = await r.json()
      for (const m of messages) bubble(m.role === 'user' ? 'user' : 'assistant', m.text)
    } catch {
      /* stale session id — starting fresh is fine */
    }
  }

  document.getElementById('reset').onclick = (e) => {
    e.preventDefault()
    localStorage.removeItem(KEY)
    location.reload()
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto'
    input.style.height = `${input.scrollHeight}px`
  })
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit() }
  })

  form.onsubmit = async (e) => {
    e.preventDefault()
    const message = input.value.trim()
    if (!message) return

    bubble('user', message)
    input.value = ''
    input.style.height = 'auto'
    send.disabled = true

    // Replies arrive as one whole message, not token by token, so this line reports what
    // the agent is actually doing (thinking, running a tool) instead of faking a cursor.
    const status = note('status', 'thinking…')
    let reply = null

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ message, session }),
      })

      // Read the server's SSE frames off the response body.
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader()
      let buffer = ''
      for (;;) {
        const { value, done } = await reader.read()
        if (done) break
        buffer += value
        const parts = buffer.split('\n\n')
        buffer = parts.pop() ?? ''
        for (const part of parts) {
          const line = part.split('\n').find((l) => l.startsWith('data: '))
          if (!line) continue
          const frame = JSON.parse(line.slice(6))

          if (frame.type === 'session') {
            session = frame.session
            localStorage.setItem(KEY, session)
          } else if (frame.type === 'status') {
            status.textContent = `${frame.label}…`
          } else if (frame.type === 'text') {
            if (!reply) { status.remove(); reply = bubble('assistant', '') }
            reply.textContent += frame.text
            scroll()
          } else if (frame.type === 'error') {
            status.remove()
            note('error', frame.message)
          } else if (frame.type === 'done') {
            status.remove()
            if (!reply && frame.outcome !== 'succeeded') note('error', `run ${frame.outcome}`)
          }
        }
      }
    } catch (err) {
      status.remove()
      note('error', String(err))
    } finally {
      status.remove()
      send.disabled = false
      input.focus()
    }
  }
</script>
